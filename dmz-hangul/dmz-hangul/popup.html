<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>DMZ 한글 지도</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #0b0c0d; color: #e8e8e8; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #f2c200; }
    label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
    input { margin-top: 3px; accent-color: #f2c200; }
    small { display: block; color: #9a9a9a; font-size: 11px; }
    button { padding: 6px; background: #1c1d1f; color: #e8e8e8; border: 1px solid #3a3b3d; border-radius: 4px; cursor: pointer; font: inherit; }
    button:hover { border-color: #f2c200; }
    /* 복사 / 비우기: 작은 버튼 두 개를 가로 한 줄로 */
    .row { display: flex; gap: 6px; margin: 4px 0 0 24px; }
    .row button { flex: 1; padding: 3px 8px; font-size: 11px; }
    p { margin: 12px 0 0; color: #9a9a9a; font-size: 11px; }
  </style>
</head>
<body>
  <h1>DMZ Codex 한글 지도</h1>
  <label>
    <input type="checkbox" id="enabled">
    <span>한글로 보기<small>끄면 원래 영문 화면으로 돌아갑니다.</small></span>
  </label>
  <label>
    <input type="checkbox" id="hover">
    <span>마우스 오버 이름 표시<small>지도의 아이콘에 마우스를 올리면 한글 이름이 나옵니다.</small></span>
  </label>
  <label>
    <input type="checkbox" id="collect">
    <span>미번역 문구 수집 (개발자용)<small>화면에 나왔지만 번역되지 않은 영문을 모읍니다.</small></span>
  </label>
  <div class="row">
    <button id="copy" title="수집한 문구를 dictionary.js 에 붙여넣는 형태로 복사">복사(0)</button>
    <button id="clear" title="수집 목록 비우기">비우기</button>
  </div>

  <!-- [보류] 모든 위치 페이지 수집: 나중에 다시 쓰려면 이 HTML 주석을 풀고,
       popup.js 와 content.js 의 [보류] 주석도 함께 푸세요.
  <button id="crawl">모든 위치 페이지 수집 (/locations/)</button>
  <small id="crawlst"></small>
  -->

  <p>설정을 바꾸면 페이지가 자동으로 새로고침됩니다.</p>
  <script src="popup.js"></script>
</body>
</html>
