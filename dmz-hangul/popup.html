<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>DMZ 한글 지도</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #0b0c0d; color: #e8e8e8; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #f2c200; }
    label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
    input { margin-top: 3px; accent-color: #f2c200; }
    small { display: block; color: #9a9a9a; font-size: 11px; }
    button { display: block; width: 100%; margin: 6px 0 0; padding: 6px; background: #1c1d1f; color: #e8e8e8; border: 1px solid #3a3b3d; border-radius: 4px; cursor: pointer; font: inherit; }
    button:hover { border-color: #f2c200; }
    p { margin: 12px 0 0; color: #9a9a9a; font-size: 11px; }
  </style>
</head>
<body>
  <h1>DMZ Codex 한글 지도</h1>
  <label>
    <input type="checkbox" id="enabled">
    <span>한글로 보기<small>끄면 원래 영문 화면으로 돌아갑니다.</small></span>
  </label>
  <label>
    <input type="checkbox" id="unofficial">
    <span>비공식 번역 포함<small>공식 한글명이 없는 항목(전리품 종류, 방 이름, 사이트 메뉴 등)도 번역합니다. 끄면 공식 표기만 적용됩니다.</small></span>
  </label>
  <label>
    <input type="checkbox" id="search">
    <span>한글 검색<small>검색창에 한글(예: 열쇠, 창산, 주유소)을 입력하면 영문으로 바꿔 검색합니다. 검색이 이상하면 꺼 보세요.</small></span>
  </label>
  <label>
    <input type="checkbox" id="collect">
    <span>미번역 문구 수집<small>화면에 나왔지만 번역되지 않은 영문(아이콘 클릭 설명 등)을 모읍니다. 아이콘을 눌러 설명을 띄운 뒤 아래 버튼으로 복사하세요.</small></span>
  </label>
  <button id="copy">수집한 문구 복사 (<span id="cnt">0</span>)</button>
  <button id="crawl">모든 위치 페이지 수집 (/locations/)</button>
  <small id="crawlst"></small>
  <button id="clear">수집 목록 비우기</button>
  <p>설정을 바꾸면 지도 페이지가 자동으로 새로고침됩니다.</p>
  <script src="popup.js"></script>
</body>
</html>
